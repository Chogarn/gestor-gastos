services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # El backend no se publica: el navegador solo habla con el frontend, que
  # reenvía /api/* a este servicio por la red interna de Docker.
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en el archivo .env}
      # Ponlo en true cuando sirvas la app por HTTPS
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:5000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Solo accesible desde este equipo. Para abrirla a la red o desplegarla, ponla detrás
      # de un proxy con HTTPS (Caddy, nginx...) y activa SESSION_COOKIE_SECURE=true en .env
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
